<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Tilaklar — boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap">
<style>
:root{
  --teal-900:#062A2B;--teal-700:#0E5C57;--gold:#C9A24B;--gold-dk:#7A5F1F;
  --cream:#FAF4E7;--paper:#FCF8EF;--ink:#10262A;--muted:#6B6B63;--line:rgba(201,162,75,.32);--red:#B23A3A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:300 15px/1.55 'Jost',system-ui,sans-serif;padding:24px 16px 60px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto}
h1{font:400 1.6rem 'Marcellus',Georgia,serif;color:var(--teal-900)}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.gate{max-width:340px;margin:12vh auto 0;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.gate h1{margin-bottom:16px}
label{display:block;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:inherit}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--teal-700);background:var(--teal-700);color:var(--cream);border-radius:10px;padding:11px 18px;font:500 .8rem 'Jost',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn--ghost{background:transparent;color:var(--teal-700)}
.btn[disabled]{opacity:.5;cursor:progress}
.gate .btn{width:100%;margin-top:14px}
.err{color:var(--red);font-size:.85rem;margin-top:10px}
.bar{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.search{margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
.item__name{font-weight:500;color:var(--teal-900)}
.item__date{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item__wish{grid-column:1/-1;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.del{grid-row:1;grid-column:2;border:1px solid var(--line);background:#fff;color:var(--red);border-radius:8px;padding:6px 10px;font:500 .72rem 'Jost',sans-serif;cursor:pointer}
.del.is-armed{background:var(--red);color:#fff;border-color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,calc(100% + 40px));background:var(--teal-900);color:var(--cream);padding:10px 18px;border-radius:10px;font-size:.85rem;transition:transform .3s ease}
.toast.is-on{transform:translate(-50%,0)}
</style>
</head>
<body>

<form class="gate" id="gate">
  <h1>Tilaklar</h1>
  <label for="pw">Admin paroli</label>
  <input type="password" id="pw" autocomplete="current-password" required>
  <button class="btn" id="gateBtn" type="submit">Kirish</button>
  <p class="err" id="gateErr" role="alert" hidden></p>
</form>

<div class="wrap" id="app" hidden>
  <div class="bar">
    <div>
      <h1>Mehmonlar tilaklari</h1>
      <p class="sub" id="count">—</p>
    </div>
    <div class="tools">
      <button class="btn btn--ghost" id="reload" type="button">Yangilash</button>
      <button class="btn" id="csv" type="button">Excel'ga yuklash</button>
    </div>
  </div>
  <div class="search">
    <label for="q">Qidirish</label>
    <input type="search" id="q" placeholder="Ism yoki tilak bo'yicha">
  </div>
  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var PW = 'toy-admin-pw', key = '', rows = [];

  function toast(m) {
    var t = $('toast'); t.textContent = m; t.classList.add('is-on');
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('is-on'); }, 2800);
  }
  function call(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Admin-Key': key, 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch('/api/' + path, opts).then(function (r) {
      if (r.status === 401) throw new Error('auth');
      if (r.status === 503) throw new Error('nodb');
      if (!r.ok) throw new Error('http');
      return r.json();
    });
  }
  function fmt(raw) {
    var d = new Date(String(raw).replace(' ', 'T') + 'Z');
    if (isNaN(d)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function errText(e) {
    if (e.message === 'auth') return "Parol noto'g'ri.";
    if (e.message === 'nodb') return 'Baza (D1) hali ulanmagan.';
    return "Serverga ulanib bo'lmadi.";
  }

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var shown = rows.filter(function (r) {
      return !q || (r.name + ' ' + r.wish).toLowerCase().indexOf(q) >= 0;
    });
    $('count').textContent = rows.length + ' ta tilak' + (q ? ' · topildi: ' + shown.length : '');
    var list = $('list');
    list.textContent = '';
    if (!shown.length) {
      var e = document.createElement('p'); e.className = 'empty';
      e.textContent = rows.length ? 'Hech narsa topilmadi.' : "Hali tilak yo'q.";
      list.appendChild(e); return;
    }
    shown.forEach(function (r) {
      var el = document.createElement('div'); el.className = 'item';
      var head = document.createElement('div');
      var n = document.createElement('div'); n.className = 'item__name'; n.textContent = r.name;
      var d = document.createElement('div'); d.className = 'item__date'; d.textContent = fmt(r.updated_at);
      head.appendChild(n); head.appendChild(d);
      var del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = "O'chirish";
      var w = document.createElement('p'); w.className = 'item__wish'; w.textContent = r.wish;
      /* Ikki bosqichli tasdiq: birinchi bosish — qurollanadi, ikkinchisi o'chiradi */
      del.addEventListener('click', function () {
        if (!del.classList.contains('is-armed')) {
          del.classList.add('is-armed'); del.textContent = 'Rostdan?';
          setTimeout(function () { del.classList.remove('is-armed'); del.textContent = "O'chirish"; }, 3500);
          return;
        }
        del.disabled = true;
        call('delete', { method: 'POST', body: JSON.stringify({ id: r.id }) }).then(function () {
          rows = rows.filter(function (x) { return x.id !== r.id; });
          render(); toast("O'chirildi");
        }).catch(function (e) { del.disabled = false; toast(errText(e)); });
      });
      el.appendChild(head); el.appendChild(del); el.appendChild(w);
      list.appendChild(el);
    });
  }

  function load() {
    return call('list').then(function (d) { rows = d.items || []; render(); });
  }

  $('gate').addEventListener('submit', function (ev) {
    ev.preventDefault();
    key = $('pw').value;
    $('gateErr').hidden = true; $('gateBtn').disabled = true;
    load().then(function () {
      try { sessionStorage.setItem(PW, key); } catch (e) {}
      $('gate').hidden = true; $('app').hidden = false;
    }).catch(function (e) {
      $('gateErr').textContent = errText(e); $('gateErr').hidden = false;
    }).then(function () { $('gateBtn').disabled = false; });
  });

  $('reload').addEventListener('click', function () { load().then(function () { toast('Yangilandi'); }).catch(function (e) { toast(errText(e)); }); });
  $('q').addEventListener('input', render);

  $('csv').addEventListener('click', function () {
    var cell = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
    var lines = ['Ism;Tilak;Vaqt'].concat(rows.map(function (r) { return [cell(r.name), cell(r.wish), cell(fmt(r.updated_at))].join(';'); }));
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'islombek-tilaklar.csv';
    document.body.appendChild(a); a.click(); a.remove();
  });

  try {
    var saved = sessionStorage.getItem(PW);
    if (saved) { $('pw').value = saved; $('gate').requestSubmit ? $('gate').requestSubmit() : $('gateBtn').click(); }
  } catch (e) {}
})();
</script>
</body>
</html>
